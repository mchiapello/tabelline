<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MathQuest{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div id="app-shell">
    <nav id="top-nav">
      <a href="/" class="nav-logo">⭐ MathQuest</a>

      <div class="nav-center" id="nav-progress">
        <!-- planets unlocked counter injected by journey.js -->
      </div>

      <div class="nav-right" id="nav-right">
        <span class="coin-count" id="nav-coins">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10" fill="#FFD700" stroke="#b89a00" stroke-width="1.5"/>
            <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#0a0a1a">$</text>
          </svg>
          <span id="coin-value">0</span>
        </span>
        <div id="nav-user">
          <!-- populated by initNav() in base JS below -->
        </div>
      </div>

      <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu">☰</button>
    </nav>

    <main id="page-content" {% block content_attrs %}{% endblock %}>
      {% block content %}{% endblock %}
    </main>

    <div id="toast-root"></div>
  </div>

  <!-- Modal root (populated by Modal.open()) -->
  <div id="modal-root"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/guest.js') }}"></script>
  <script src="{{ url_for('static', filename='js/rewards.js') }}"></script>

  <script>
    // ── Nav init ──────────────────────────────────────────────────────────────
    (function initNav() {
      const navUser  = document.getElementById('nav-user');
      const coinEl   = document.getElementById('coin-value');

      // Restore guest coins
      const gs = Guest.load();
      coinEl.textContent = gs.coins || 0;

      if (Guest.isLoggedIn()) {
        // Fetch /api/v1/auth/me and populate nav
        API.get('/auth/me').then(data => {
          const initial = (data.username || '?')[0].toUpperCase();
          navUser.innerHTML = `
            <a href="/profile" class="nav-avatar" title="${data.username}">${initial}</a>`;
          if (data.wallet) {
            coinEl.textContent = data.wallet.coins || 0;
          }
        }).catch(() => {
          // Token invalid — clear and show guest nav
          localStorage.removeItem('mq_access_token');
          localStorage.removeItem('mq_refresh_token');
          showGuestNav();
        });
      } else {
        showGuestNav();
      }

      function showGuestNav() {
        navUser.innerHTML = `
          <a href="/auth/login" class="btn btn--ghost btn--sm">Accedi</a>
          <a href="/auth/register" class="btn btn--secondary btn--sm">Registrati</a>`;
      }

      // Hamburger toggle (mobile)
      document.getElementById('nav-hamburger').addEventListener('click', () => {
        document.getElementById('nav-right').classList.toggle('open');
      });

      // Auth expiry handler
      window.addEventListener('mq:auth-expired', () => showGuestNav());
    })();

    // ── Modal helper ──────────────────────────────────────────────────────────
    const Modal = (() => {
      let currentCleanup = null;

      function open(type, data) {
        const root = document.getElementById('modal-root');

        if (type === 'planet-menu') {
          const { table, state } = data;
          root.innerHTML = `
            <div class="modal-overlay" id="modal-overlay">
              <div class="modal-box">
                <button class="modal-box__close" id="modal-close">✕</button>
                <div class="modal-title">Tabella del ${table}</div>
                <p style="color:var(--c-text-dim);margin-bottom:var(--sp-4)">
                  Scegli la modalità di gioco
                </p>
                <div class="modal-actions">
                  <button class="btn btn--primary" onclick="Modal.startGame('explorer',${table})">
                    🚀 Explorer — Impara
                  </button>
                  <button class="btn btn--secondary" onclick="Modal.startGame('mission',${table})">
                    📅 Missione del Giorno
                  </button>
                  <button class="btn btn--secondary" onclick="Modal.startGame('speedrun',${table})">
                    ⚡ Speed Run — 60s
                  </button>
                  <button class="btn btn--ghost" onclick="Modal.startGame('boss_battle',${table})"
                    ${state !== 'mastered' ? 'title="Completa almeno una sessione Explorer prima"' : ''}>
                    ⚔️ Boss Battle${state !== 'mastered' ? ' 🔒' : ''}
                  </button>
                </div>
              </div>
            </div>`;

          document.getElementById('modal-close').onclick = close;
          document.getElementById('modal-overlay').onclick = (e) => {
            if (e.target.id === 'modal-overlay') close();
          };
        }

        if (type === 'custom-setup') {
          const tableCheckboxes = Array.from({ length: 10 }, (_, i) => i + 1)
            .map(n => `
              <label class="table-checkbox">
                <input type="checkbox" class="custom-table-cb" value="${n}" ${n === 2 ? 'checked' : ''}>
                <span>${n}</span>
              </label>`)
            .join('');

          root.innerHTML = `
            <div class="modal-overlay" id="modal-overlay">
              <div class="modal-box">
                <button class="modal-box__close" id="modal-close">✕</button>
                <div class="modal-title">🎯 Allenamento libero</div>
                <p style="color:var(--c-text-dim);margin-bottom:var(--sp-4)">
                  Scegli tabellina, numero di domande e timer
                </p>
                <div class="form-field">
                  <label>Tabelline (puoi sceglierne più di una)</label>
                  <div class="checkbox-grid">${tableCheckboxes}</div>
                </div>
                <div class="form-field">
                  <label for="custom-num">Numero di domande</label>
                  <select id="custom-num">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                  </select>
                </div>
                <div class="form-field">
                  <label for="custom-timer">Timer per domanda</label>
                  <select id="custom-timer">
                    <option value="0" selected>Nessun timer</option>
                    <option value="10">10 secondi</option>
                    <option value="5">5 secondi</option>
                    <option value="3">3 secondi</option>
                  </select>
                </div>
                <label class="form-checkbox">
                  <input type="checkbox" id="custom-facilitato">
                  <span>🧩 Modalità Facilitato — mostra la tabellina completa</span>
                </label>
                <div class="modal-actions">
                  <button class="btn btn--primary" onclick="Modal.startCustomGame()">▶ Inizia</button>
                </div>
              </div>
            </div>`;

          document.getElementById('modal-close').onclick = close;
          document.getElementById('modal-overlay').onclick = (e) => {
            if (e.target.id === 'modal-overlay') close();
          };
        }
      }

      function close() {
        document.getElementById('modal-root').innerHTML = '';
        if (currentCleanup) { currentCleanup(); currentCleanup = null; }
      }

      function startGame(mode, table) {
        close();
        // Navigate to game page with params
        window.location.href = `/game?mode=${mode}&table=${table}`;
      }

      function startCustomGame() {
        const checked = Array.from(document.querySelectorAll('.custom-table-cb:checked'))
          .map(cb => cb.value);
        const tables     = checked.length ? checked : ['2'];
        const num        = document.getElementById('custom-num').value;
        const timer      = document.getElementById('custom-timer').value;
        const facilitato = document.getElementById('custom-facilitato').checked ? '1' : '0';
        close();
        window.location.href =
          `/game?mode=custom&table=${tables[0]}&tables=${tables.join(',')}` +
          `&num=${num}&timer=${timer}&facilitato=${facilitato}`;
      }

      return { open, close, startGame, startCustomGame };
    })();
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
