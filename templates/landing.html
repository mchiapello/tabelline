{% extends "base.html" %}

{% block title %}MathQuest — Impara le tabelline giocando{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/journey.css') }}">
{% endblock %}

{% block content_attrs %}class="full-width"{% endblock %}

{% block content %}
<div id="landing-root"></div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/journey.js') }}"></script>
<script>
  (function() {
    const root = document.getElementById('landing-root');

    if (Guest.isLoggedIn()) {
      window.location.replace('/journey');
      return;
    }

    root.innerHTML = `
      <section id="galaxy-map">
        <div class="hero">
          <h1 class="hero__title">Conquista la Galassia delle Tabelline</h1>
          <p class="hero__subtitle">
            Impara le moltiplicazioni con un gioco di esplorazione spaziale.
            9 pianeti, 5 modalità di gioco, progressi salvati automaticamente.
          </p>
          <div class="hero__cta">
            <a href="/journey" class="btn btn--primary btn--lg">🚀 Inizia a giocare</a>
            <a href="/auth/register" class="btn btn--secondary">Crea account</a>
          </div>
          <div class="hero__stats">
            <div class="hero__stat">
              <span class="hero__stat-number">9</span>
              <span class="hero__stat-label">pianeti</span>
            </div>
            <div class="hero__stat">
              <span class="hero__stat-number">5</span>
              <span class="hero__stat-label">modalità</span>
            </div>
            <div class="hero__stat">
              <span class="hero__stat-number">∞</span>
              <span class="hero__stat-label">divertimento</span>
            </div>
          </div>
        </div>

        <div id="planet-path"></div>

        <div id="map-legend">
          <div class="legend-item">
            <div class="legend-dot legend-dot--locked"></div>
            <span>Bloccato</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot legend-dot--available"></div>
            <span>Disponibile</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot legend-dot--mastered"></div>
            <span>Conquistato</span>
          </div>
        </div>
      </section>`;
  })();
</script>
{% endblock %}
