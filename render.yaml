services:
  - type: web
    name: mathquest
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: /var/data/mathquest.db
    disk:
      name: mathquest-db
      mountPath: /var/data
      sizeGB: 1
